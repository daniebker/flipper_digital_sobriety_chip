name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Date math unit tests
        run: make -C tests

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk-channel: [release, dev]
    steps:
      - uses: actions/checkout@v4
      - name: Build FAP with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
      - name: Upload FAP
        uses: actions/upload-artifact@v4
        with:
          name: sobriety_chip-${{ matrix.sdk-channel }}
          path: ${{ steps.build.outputs.fap-artifacts }}
